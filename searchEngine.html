<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
</head>
<style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.5rem 1rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        #searchForm {
            display: flex;
            gap: 0.5rem;
            max-width: 550px;
            margin: 0 auto 2.5rem auto;
        }

        #searchInput {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            background-color: var(--card-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #searchInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        #searchForm button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #searchForm button:hover {
            background-color: var(--primary-hover);
        }

        #output {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        /* Message styling (e.g. empty search or no results) */
        #output > p {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1rem;
            color: var(--text-muted);
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 0.5rem;
            border: 1px dashed var(--border);
        }

        /* Dynamically generated product cards */
        #output > div {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        #output > div:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        #output h3 {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.2rem;
        }

        #output p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Category Badge */
        #output p:nth-of-type(1) {
            text-transform: capitalize;
            display: inline-block;
            width: fit-content;
            background-color: #f1f5f9;
            color: #475569;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }

        /* Price */
        #output p:nth-of-type(2) {
            font-size: 1.15rem;
            font-weight: 700;
            color: #059669;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        /* Stock */
        #output p:nth-of-type(3) {
            font-size: 0.8rem;
        }
    </style>       
<body>
    <h1>Product Search</h1>
    <form action="" id="searchForm">
    <input type="text" id="searchInput" placeholder="Search a product">
    <button type="submit">Search</button>
    </form>
    <div id="output"></div>
   
</body>
  <script>
    let data = {

    {"id": 30, "title": "Kiwi", "category": "groceries", "price": 2.49, "stock": 99}

  ]
    }
    let searchForm = document.getElementById('searchForm');
    let searchInput = document.getElementById('searchInput');
    let output = document.getElementById('output');

     searchForm.addEventListener('submit', function (event) {
        event.preventDefault();
        let searchInputValue = searchInput.value.trim().toLowerCase();
        if (searchInputValue === '') {
            output.innerHTML = `<p>Please type something to search Idiot!!!.</p> `
            return;
        }
       
        let result = data.products.filter(function (products) {
            return products.title.toLowerCase().includes(searchInputValue) ||
             products.category.toLowerCase().includes(searchInputValue)
        })
        output.innerHTML = '';
        if (result.length === 0) {
            output.innerHTML = '<p>No products found.</p>'
            return;
        }
        
        result.forEach(function(product) {
            output.innerHTML += ` <div>
        <h3>${product.title}</h3>
        <p>Category: ${product.category}</p>
        <p>Price: $${product.price}</p>
        <p>Stock: ${product.stock}</p>
    </div>`;
        })
     })
  </script>
</html>
